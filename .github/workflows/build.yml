name: 构建桌面开发制品

on:
  push:
    branches:
      - agentbridge-base
      - "codex/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: 静态检查与测试（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: 安装 Linux 桌面依赖（如 runner 提供）
        if: runner.os == 'Linux'
        run: echo "当前矩阵只使用 macOS 和 Windows runner"
      - name: 安装前端依赖
        run: npm ci
      - name: 打包配置检查
        run: npm run test:e2e-config
      - name: 前端测试
        run: npm test -- --run
      - name: Rust 测试
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Rust 静态分析
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: 构建未签名桌面开发制品
        run: npm run tauri:build
      - name: 上传制品
        uses: actions/upload-artifact@v4
        with:
          name: agentbridge-${{ matrix.os }}-dev
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
          retention-days: 14

  package-windows:
    name: 构建 Windows NSIS 安装包
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: 安装前端依赖
        run: npm ci
      - name: 构建未签名 Windows 安装包
        run: npm run tauri:build
      - name: 上传 Windows 安装包
        uses: actions/upload-artifact@v4
        with:
          name: agentbridge-windows-2022-dev
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
