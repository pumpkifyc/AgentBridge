[package]
name = "agentbridge"
version = "0.1.1"
description = "局域网 Codex 会话分享工具"
authors = ["AgentBridge"]
edition = "2024"
default-run = "agentbridge"

[[bin]]
name = "agentbridge"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "agentbridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
thiserror = "2"
tokio = { version = "1.54.1", features = ["net", "io-util", "rt", "rt-multi-thread", "time", "macros", "sync"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = "0.13"
rustls-pemfile = "2"
sha2 = "0.10"
rand = "0.9"
base64 = "0.22"
hex = "0.4"
chrono = "0.4"
getrandom = "0.3"
rusqlite = { version = "0.42", features = ["bundled"] }
tauri-plugin-dialog = "2"
if-addrs = "0.13"
zstd = "0.13"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tauri-utils = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
